<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAFIR — AI Integrated Framework for Patent Classification & Retrieval</title>

  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans antialiased min-h-screen">
